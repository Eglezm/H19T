<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>H19T</title>
    <meta name="description" content="H19T — Torneos de golf entre amigos" />
    <meta name="theme-color" content="#F7F6F2" />
    <style>
      * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
      html, body { background: #F7F6F2; }
      body { margin:0; overflow-x:hidden; }

      /* ── Fondo con profundidad: mesh gradient animado + topografía + grano ── */
      #bg-mesh {
        position: fixed; inset: -10%; z-index: -3; pointer-events: none;
        background:
          radial-gradient(circle at 18% 22%, rgba(0,86,63,0.07) 0%, transparent 42%),
          radial-gradient(circle at 82% 28%, rgba(201,162,39,0.06) 0%, transparent 40%),
          radial-gradient(circle at 45% 82%, rgba(0,86,63,0.05) 0%, transparent 48%);
        background-repeat: no-repeat;
        animation: meshMove 19s ease-in-out infinite alternate;
      }
      @keyframes meshMove {
        0%   { background-position: 0% 0%, 100% 10%, 30% 100%; }
        100% { background-position: 15% 25%, 75% 35%, 55% 75%; }
      }
      #bg-topo { position: fixed; inset: 0; z-index: -2; width: 100%; height: 100%; opacity: 0.045; pointer-events: none; }
      #bg-grain { position: fixed; inset: 0; z-index: -1; width: 100%; height: 100%; opacity: 0.03; pointer-events: none; mix-blend-mode: multiply; }

      /* ── Animaciones de interacción ── */
      @keyframes fadeInUp { from { opacity:0; transform:translateY(10px);} to { opacity:1; transform:translateY(0);} }
      @keyframes liveDotPulse { 0%,100% { transform:scale(1); opacity:1; } 50% { transform:scale(1.5); opacity:0.55; } }
      @keyframes achievementGlow { 0%,100% { box-shadow:0 0 0 0 rgba(201,162,39,0.35);} 50% { box-shadow:0 0 0 10px rgba(201,162,39,0);} }
      @keyframes gradientShift { 0% {background-position:0% 50%;} 50% {background-position:100% 50%;} 100% {background-position:0% 50%;} }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes scoreFlash {
        0%   { background-color: rgba(201,162,39,0.38); }
        100% { background-color: rgba(0,86,63,0); }
      }
      @keyframes popIn { from { opacity:0; transform:scale(0.9); } to { opacity:1; transform:scale(1); } }
      @keyframes tabSlideIn { from { opacity:0; transform:translateX(14px); } to { opacity:1; transform:translateX(0); } }

      .h19-card { animation: fadeInUp 420ms cubic-bezier(0.22,1,0.36,1) both; transition: transform 250ms cubic-bezier(0.22,1,0.36,1), box-shadow 250ms cubic-bezier(0.22,1,0.36,1); }
      .h19-card:active { transform: scale(0.99); }
      .h19-btn { transition: transform 220ms cubic-bezier(0.22,1,0.36,1), opacity 220ms ease, box-shadow 220ms ease; }
      .h19-btn:active { transform: scale(0.96); opacity:0.9; }
      .h19-tab-btn { transition: color 250ms ease; }
      .h19-tab-indicator { transition: transform 320ms cubic-bezier(0.22,1,0.36,1), width 320ms cubic-bezier(0.22,1,0.36,1), left 320ms cubic-bezier(0.22,1,0.36,1), top 320ms cubic-bezier(0.22,1,0.36,1); }
      .h19-pulse { animation: achievementGlow 2.4s ease-in-out infinite; }
      .h19-live-dot { animation: liveDotPulse 1.6s ease-in-out infinite; }
      .h19-gradient-move { background-size: 200% 200%; animation: gradientShift 6s ease infinite; }
      .h19-spin { animation: spin 900ms linear infinite; }
      .h19-flash { animation: scoreFlash 2.4s cubic-bezier(0.22,1,0.36,1) both; }
      .h19-pop { animation: popIn 320ms cubic-bezier(0.22,1,0.36,1) both; }
      .h19-tab-panel { animation: tabSlideIn 300ms cubic-bezier(0.22,1,0.36,1) both; }
      .h19-reorder-row { transition: transform 420ms cubic-bezier(0.22,1,0.36,1); }
      ::selection { background: rgba(0,86,63,0.18); }
    </style>
  </head>
  <body>
    <svg id="bg-topo" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="topoPattern" width="420" height="420" patternUnits="userSpaceOnUse">
          <path d="M-20,60 Q90,10 210,60 T440,60" stroke="#00563F" stroke-width="1" fill="none"/>
          <path d="M-20,120 Q90,80 210,120 T440,120" stroke="#00563F" stroke-width="1" fill="none"/>
          <path d="M-20,190 Q90,150 210,190 T440,190" stroke="#C9A227" stroke-width="1" fill="none"/>
          <path d="M-20,260 Q90,220 210,260 T440,260" stroke="#00563F" stroke-width="1" fill="none"/>
          <path d="M-20,330 Q90,300 210,330 T440,330" stroke="#00563F" stroke-width="1" fill="none"/>
          <path d="M-20,390 Q90,360 210,390 T440,390" stroke="#00563F" stroke-width="1" fill="none"/>
        </pattern>
      </defs>
      <rect width="100%" height="100%" fill="url(#topoPattern)"/>
    </svg>
    <svg id="bg-grain" xmlns="http://www.w3.org/2000/svg">
      <filter id="grainFilter">
        <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch" result="noise"/>
        <feColorMatrix in="noise" type="saturate" values="0"/>
      </filter>
      <rect width="100%" height="100%" filter="url(#grainFilter)"/>
    </svg>
    <div id="bg-mesh"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
